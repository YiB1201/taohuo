name: Release2Gitee

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find APK files in app/release
        id: apk
        run: |
          set -euo pipefail
          APK_FILES=$(find app/release -name '*.apk' -type f 2>/dev/null | sort)
          if [ -z "$APK_FILES" ]; then
            echo "::error::No APK files found in app/release/"
            exit 1
          fi
          echo "Found APK files:"
          echo "$APK_FILES"
          FIRST_APK=$(echo "$APK_FILES" | head -n1)
          APK_BASENAME=$(basename "$FIRST_APK" .apk)
          echo "apk_basename=$APK_BASENAME" >> "$GITHUB_OUTPUT"
          echo "apk_count=$(echo "$APK_FILES" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Read version from build.gradle.kts
        id: version
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle.kts ]; then
            echo "version_name=" >> "$GITHUB_OUTPUT"
            echo "version_code=" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
            echo "app/build.gradle.kts not found"
            exit 1
          fi
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || true)
          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME (Code: $VERSION_CODE, Tag: $TAG_NAME)"

      - name: Check if tag already exists
        id: check_tag
        run: |
          set -euo pipefail
          git fetch --tags --prune
          TAG="${{ steps.version.outputs.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No tag name to check."
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, proceeding with release."
          fi

      # - name: action-gitee-release
      #   uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
      #   with:
      #     # 执行的操作类型: create_release, upload_asset, delete_release, delete_asset, update_asset
      #     gitee_action: create_release
      #     # Gitee 用户名, 项目URL中可获取
      #     gitee_owner: LiuYong-Kang1201
      #     # Gitee 项目名, 项目URL中可获取
      #     gitee_repo: taohuo-release
      #     gitee_target_commitish: master
      #     gitee_upload_retry_times: 3
      #     # Gitee api token
      #     gitee_token: ${{ secrets.GITEE_TOKEN }}
      #     # Gitee Tag 名称
      #     gitee_tag_name: ${{ steps.version.outputs.tag_name }}
      #     # Gitee release 名称
      #     gitee_release_name: ${{ steps.version.outputs.tag_name }}
      #     # 上传的附件列表(多个文件)
      #     gitee_files: app/release/*.apk
      #     # Gitee release 描述
      #     gitee_release_body: |
      #       ## 版本信息
      #       - 版本号: ${{ steps.version.outputs.version_name }}
      #       - 版本代码: ${{ steps.version.outputs.version_code }}
      #       - 构建时间: ${{ github.event.head_commit.timestamp }}
      - name: sync-github-release-to-gitee
        # You may pin to the exact commit or the version.
        # uses: trustedinster/sync-release-gitee@c91fb121df8bb3607b0d1294c31d649783bae120
        uses: trustedinster/sync-release-gitee@v1.3
        with:
          # gitee 用户名, 项目URL中可获取
          gitee_owner: LiuYong-Kang1201
          # gitee 项目名, 项目URL中可获取
          gitee_repo: taohuo-release
          # gitee api token
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          # github 用户名, 项目URL中可获取
          github_owner: YiB1201
          # github 项目名, 项目URL中可获取
          github_repo: taohuo
          # 上传附件失败后的尝试次数
          gitee_upload_retry_times: 3
          # 是否开启debug模式
          debug: # optional
